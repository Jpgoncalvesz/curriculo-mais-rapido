name: Verificar projeto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verificar saída para Vercel pela raiz
        run: node -e "const fs=require('node:fs'); for(const f of ['dist/index.html','dist/favicon.ico','dist/favicon-movimento.svg','dist/curriculo-mais-rapido-extensao.zip']) if(!fs.existsSync(f)) throw Error('Arquivo ausente '+f)"
        working-directory: .
      - name: Compilar para Vercel pela pasta frontend
        run: npm run build -- --outDir dist
      - name: Verificar saída para Vercel pela pasta frontend
        run: node -e "const fs=require('node:fs'); for(const f of ['dist/index.html','dist/favicon.ico','dist/favicon-movimento.svg','dist/curriculo-mais-rapido-extensao.zip']) if(!fs.existsSync(f)) throw Error('Arquivo ausente '+f)"
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test extension/scan.test.cjs extension/fill.test.cjs
        working-directory: .
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
